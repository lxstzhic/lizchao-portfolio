<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">探索与知识进程系统逻辑图</title><desc id="desc">玩家通过探索发现线索，记录知识，满足信息门控后解锁谜题，结果反馈再次推动探索。</desc><defs><pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.5" fill="#284158"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7fc8ff"/></marker><marker id="arrowAccent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#77e0bd"/></marker></defs><rect width="1200" height="620" fill="#0d1a2a"/><rect x="28" y="28" width="1144" height="564" fill="url(#dots)" opacity=".55"/><text x="60" y="76" fill="#8b9aab" font-family="Arial,Microsoft YaHei,sans-serif" font-size="15" letter-spacing="2">OUTER WILDS / SYSTEM LOGIC</text><text x="60" y="112" fill="#eaf0f6" font-family="Arial,Microsoft YaHei,sans-serif" font-size="28" font-weight="700">探索驱动的知识进程</text><path d="M 238 300 H 320" stroke="#7fc8ff" stroke-width="2" marker-end="url(#arrow)"/><path d="M 498 300 H 580" stroke="#7fc8ff" stroke-width="2" marker-end="url(#arrow)"/><path d="M 758 300 H 840" stroke="#77e0bd" stroke-width="2" marker-end="url(#arrowAccent)"/><path d="M 1020 300 C 1100 300 1108 478 900 478 H 238 C 170 478 150 410 180 370" fill="none" stroke="#77e0bd" stroke-width="2" stroke-dasharray="7 7" marker-end="url(#arrowAccent)"/><g font-family="Arial,Microsoft YaHei,sans-serif"><rect x="60" y="248" width="178" height="104" fill="#142b40" stroke="#52748f"/><text x="84" y="286" fill="#8b9aab" font-size="13">STEP 01</text><text x="84" y="321" fill="#eaf0f6" font-size="20" font-weight="700">探索区域</text><text x="84" y="344" fill="#9db4c8" font-size="12">行为：移动 / 观察</text><rect x="320" y="248" width="178" height="104" fill="#142b40" stroke="#52748f"/><text x="344" y="286" fill="#8b9aab" font-size="13">STEP 02</text><text x="344" y="321" fill="#eaf0f6" font-size="20" font-weight="700">发现线索</text><text x="344" y="344" fill="#9db4c8" font-size="12">输入：文本 / 环境信息</text><rect x="580" y="248" width="178" height="104" fill="#142b40" stroke="#52748f"/><text x="604" y="286" fill="#8b9aab" font-size="13">STEP 03</text><text x="604" y="321" fill="#eaf0f6" font-size="20" font-weight="700">知识记录</text><text x="604" y="344" fill="#9db4c8" font-size="12">状态：已验证 / 待验证</text><rect x="840" y="248" width="180" height="104" fill="#12352f" stroke="#77e0bd"/><text x="864" y="286" fill="#77e0bd" font-size="13">GATE</text><text x="864" y="321" fill="#eaf0f6" font-size="20" font-weight="700">谜题解锁</text><text x="864" y="344" fill="#a6f8dd" font-size="12">条件：知识满足门控</text><rect x="392" y="430" width="416" height="72" fill="#101f30" stroke="#39566e"/><text x="600" y="458" text-anchor="middle" fill="#8b9aab" font-size="12">系统反馈</text><text x="600" y="484" text-anchor="middle" fill="#77e0bd" font-size="18" font-weight="700">玩家认知变化 → 下一轮探索</text></g><text x="60" y="560" fill="#60768b" font-family="Arial,Microsoft YaHei,sans-serif" font-size="12">信息门控把“知道什么”转化为“能做什么”，让探索、记录与解锁形成可验证闭环。</text></svg>
